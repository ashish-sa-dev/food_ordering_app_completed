<div class="min-h-screen bg-[#F5EDE6] flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl p-8 shadow-lg">
    <h2 class="text-2xl font-bold text-center mb-6 text-[#3E2F2A]">Login</h2>

    <form class="space-y-4" [formGroup]="userForm">
      <!-- Email -->
      <div>
        <label class="block mb-1 text-[#3E2F2A]">Email</label>
        <input
          formControlName="email"
          type="email"
          class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#9E2A21]"
          placeholder="Enter your email"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block mb-1 text-[#3E2F2A]">Password</label>
        <input
          formControlName="password"
          type="password"
          class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#9E2A21]"
          placeholder="Enter your password"
        />
        <a routerLink="/forgot-password" class="text-[#9E2A21]">Forgot password?</a>
      </div>

      <!-- Login Button -->
      <button
        (click)="onSubmit()"
        class="w-full bg-[#9E2A21] hover:bg-[#8a241d] text-white p-3 rounded-lg font-semibold transition"
      >
        Login
      </button>
    </form>

    <p class="text-center mt-4 text-[#3E2F2A]">
      Don’t have an account?
      <a routerLink="/register" class="text-[#9E2A21] font-semibold">Register</a>
    </p>
  </div>
</div>
