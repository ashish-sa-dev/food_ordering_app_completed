<div class="max-w-3xl mx-auto p-6">
  <h1 class="text-3xl font-bold mb-6">Your Cart</h1>

  <!-- Empty Cart -->
  @if (cart.length === 0) {
    <div class="text-center text-gray-500 text-lg mt-20">Your cart is empty.</div>
  }

  <!-- Cart Items -->
  @else {
    <div class="space-y-4">
      @for (item of cart; track item.menuItem) {
        <div class="flex items-center bg-white p-4 rounded-xl shadow justify-between">
          <div>
            <h3 class="text-lg font-semibold capitalize">{{ item.name }}</h3>
            <p class="text-gray-600">₹{{ item.price }}</p>
          </div>

          <div class="flex items-center gap-3">
            <!-- decrease -->
            <button class="w-8 h-8 rounded-full bg-gray-200 text-gray-700" (click)="decrease(item)">
              -
            </button>

            <span class="text-lg font-bold">{{ item.quantity }}</span>

            <!-- increase -->
            <button class="w-8 h-8 rounded-full bg-gray-200 text-gray-700" (click)="increase(item)">
              +
            </button>

            <!-- remove item -->
            <button class="text-red-600 ml-4" (click)="remove(item.menuItem)">Remove</button>
          </div>
        </div>
      }
    </div>

    <!-- Cart Summary -->
    <div class="mt-8 bg-white p-6 rounded-xl shadow">
      <div class="flex justify-between text-xl font-semibold">
        <span>Total</span>
        <span>₹{{ total }}</span>
      </div>

      <button
        class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl text-lg"
        (click)="checkout()"
      >
        Proceed to Checkout
      </button>

      <button
        class="mt-3 w-full bg-gray-200 hover:bg-gray-300 py-3 rounded-xl text-lg"
        (click)="goBack()"
      >
        Back to Restaurant
      </button>
    </div>
  }
</div>
