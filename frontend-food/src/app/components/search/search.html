<section
  class="discover-section mt-2 bg-cover bg-center bg-no-repeat"
  style="
    background-image: url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092?w=1200');
  "
>
  <div class="discover-content bg-white/70 backdrop-blur-sm p-10 rounded-xl max-w-3xl mx-auto">
    <h1 class="text-4xl font-bold text-gray-900 mb-3">Discover the best food near you</h1>

    <p class="text-gray-700 mb-6">Order from your favorite restaurants</p>

    <!-- Search Bar -->
    <div class="flex items-center bg-white rounded-full shadow-md overflow-hidden max-w-xl">
      <input
        type="text"
        placeholder="Search for restaurants or dishes"
        class="flex-1 px-5 py-3 focus:outline-none"
        [(ngModel)]="searchText"
        (keyup.enter)="onSearch()"
      />
      <button class="bg-red-700 text-white px-6 py-3" (click)="onSearch()">
        <i class="fas fa-search"></i>
      </button>
    </div>
  </div>
</section>
