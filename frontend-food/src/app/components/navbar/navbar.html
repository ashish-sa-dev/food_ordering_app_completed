<nav class="nav bg-[#9E2A21] rounded-lg p-4">
  <!-- Left Side: Logo -->
  <div class="flex items-center">
    <a routerLink="/" class="text-white text-xl font-bold hover:text-[#df9590] transition-colors">
      <span class="hidden sm:inline">FOODIFY</span>
      <span class="sm:hidden">F</span>
    </a>
  </div>

  <!-- Middle: Navigation Links -->
  <div class="flex items-center justify-center flex-1">
    <div class="flex items-center space-x-8">
      <!-- Home Link -->
      <a 
        routerLink="/" 
        [routerLinkActive]="'text-[#df9590] font-semibold'"
        [routerLinkActiveOptions]="{exact: true}"
        class="text-white hover:text-[#df9590] transition-colors text-lg"
      >
        Home
      </a>

      <!-- My Orders Link (only when logged in) -->
      @if (isLoggedIn) {
        <a 
          routerLink="/orders" 
          [routerLinkActive]="'text-[#df9590] font-semibold'"
          class="text-white hover:text-[#df9590] transition-colors text-lg"
        >
          My Orders
        </a>
      }
    </div>
  </div>

  <!-- Right Side: Auth/Actions -->
  <div class="flex items-center space-x-4">
    <!-- Cart Icon (only when logged in) -->
    @if (isLoggedIn) {
      <button 
        routerLink="/cart"
        class="text-white hover:text-[#df9590] transition-colors relative"
        title="Cart"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
        <!-- Cart badge would go here -->
      </button>
    }

    <!-- User Authentication Section -->
    @if (!isLoggedIn) {
      <!-- Login/Signup buttons -->
      <div class="flex space-x-2">
        <button 
          routerLink="/login"
          class="px-4 py-2 bg-[#df9590] text-[#3b1f16] rounded-lg hover:bg-[#f0b2ad] transition-colors font-semibold"
        >
          Login
        </button>
        <button 
          routerLink="/register"
          class="px-4 py-2 bg-white text-[#9E2A21] rounded-lg hover:bg-gray-100 transition-colors font-semibold"
        >
          Sign Up
        </button>
      </div>
    } @else {
      <!-- User Profile Dropdown -->
      <div class="relative" #userDropdown>
        <button 
          (click)="toggleUserDropdown()"
          class="flex items-center space-x-2 text-white hover:text-[#df9590] transition-colors focus:outline-none"
        >
          <!-- User Avatar -->
          <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-[#9E2A21] font-bold">
            {{ getUserInitials() }}
          </div>
          <!-- User Name (hidden on mobile) -->
          <span class="hidden md:inline">{{ currentUser?.fullname || 'User' }}</span>
          <!-- Dropdown Arrow -->
          <svg 
            class="w-4 h-4 transition-transform" 
            [class.rotate-180]="showUserDropdown"
            fill="none" 
            stroke="currentColor" 
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <!-- Dropdown Menu -->
        @if (showUserDropdown) {
          <div 
            class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-50 border border-gray-200"
            (click)="$event.stopPropagation()"
          >
            <!-- User Info -->
            <div class="px-4 py-3 border-b border-gray-100">
              <p class="text-sm font-semibold text-gray-900 truncate">{{ currentUser?.fullname }}</p>
              <p class="text-xs text-gray-500 truncate">{{ currentUser?.email }}</p>
            </div>
            
            <!-- Menu Items -->
            <a 
              routerLink="/profile" 
              (click)="closeDropdown()"
              class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
            >
              <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
              My Profile
            </a>
            
            <a 
              routerLink="/orders" 
              (click)="closeDropdown()"
              class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
            >
              <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
              </svg>
              My Orders
            </a>
            
            <!-- Logout -->
            <button 
              (click)="logout()"
              class="w-full text-left flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors"
            >
              <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              Logout
            </button>
          </div>
        }
      </div>
    }
  </div>
</nav>

<!-- Click outside to close dropdown -->
@if (showUserDropdown) {
  <div 
    class="fixed inset-0 z-40" 
    (click)="closeDropdown()"
  ></div>
}
